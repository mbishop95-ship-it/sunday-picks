name: Update NASCAR 2027 Results
on:
  workflow_dispatch:
  schedule:
    - cron: "27 */2 * * 0,1"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch 2027 NASCAR Cup results when season begins
        env:
          NASCAR_SEASON: '2027'
          NASCAR_RESULTS_PATH: data/results-2027.json
        run: |
          if [ "$(date -u +%Y)" != "2027" ]; then
            echo "2027 season not started; preserving 2027 schedule."
            exit 0
          fi
          python scripts/update_results.py
      - name: Commit updated 2027 results
        run: |
          git config user.name "Sunday Picks Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/results-2027.json
          git diff --cached --quiet || git commit -m "Update 2027 NASCAR results"
          git push
