name: Update NASCAR Results
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * 0,1"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch official NASCAR Cup results
        run: python scripts/update_results.py
      - name: Commit updated results
        run: |
          git config user.name "Sunday Picks Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/results.json
          git diff --cached --quiet || git commit -m "Update official NASCAR results"
          git push
